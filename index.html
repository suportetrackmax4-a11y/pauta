<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#16191d;
    --suave:#69727c;
    --papel:#e9ecef;
    --superficie:#ffffff;
    --linha:#d3d9df;
    --cobalto:#1f4fd8;
    --ambar:#b5741a;
    --verde:#2e7048;
    --tijolo:#b23a2f;
    --raio:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel);
    color:var(--tinta);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--cobalto);outline-offset:2px}

  .quadro{max-width:1180px;margin:0 auto;padding:0 20px 80px}

  /* cabeçalho */
  header.topo{padding:26px 0 0}
  .marca{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .marca h1{font-size:23px;font-weight:600;letter-spacing:-.015em;margin:0}
  .marca p{margin:0;color:var(--suave);font-size:14px}
  .salvo{margin-left:auto;font-size:13px;color:var(--suave)}
  .salvo[data-estado="erro"]{color:var(--tijolo)}

  .termometro{display:flex;height:6px;margin:16px 0 0;background:var(--linha);border-radius:99px;overflow:hidden}
  .termometro span{display:block;transition:width .35s ease}
  .t-pendente{background:var(--tijolo)}
  .t-andamento{background:var(--ambar)}
  .t-concluida{background:var(--verde)}
  .legenda{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 0;font-size:13px;color:var(--suave)}
  .legenda b{font-weight:500;color:var(--tinta)}
  .legenda i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:1px}

  /* abas */
  nav.abas{display:flex;gap:4px;margin:22px 0 0;border-bottom:1px solid var(--linha)}
  nav.abas button{
    background:none;border:0;padding:10px 14px;margin-bottom:-1px;cursor:pointer;
    color:var(--suave);border-bottom:2px solid transparent;font-weight:500;
  }
  nav.abas button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--cobalto)}
  nav.abas .conta{color:var(--suave);font-weight:400;margin-left:6px}

  /* layout */
  .corpo{display:grid;grid-template-columns:196px 1fr;gap:28px;margin-top:22px;align-items:start}
  aside{position:sticky;top:20px}
  .grupo{margin-bottom:22px}
  .grupo h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--suave)}
  .grupo button{
    display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
    padding:5px 8px;border-radius:var(--raio);text-align:left;color:var(--tinta);font-size:14px;
  }
  .grupo button:hover{background:#dfe4e9}
  .grupo button[aria-pressed="true"]{background:var(--tinta);color:#fff}
  .grupo button .n{margin-left:auto;color:var(--suave);font-size:13px}
  .grupo button[aria-pressed="true"] .n{color:#b6bec8}
  .vazio-filtro{font-size:13px;color:var(--suave);padding:0 8px}

  /* entrada rápida */
  .rapida{display:flex;gap:8px;margin-bottom:16px}
  .rapida input{
    flex:1;padding:11px 13px;border:1px solid var(--linha);border-radius:var(--raio);
    background:var(--superficie);
  }
  .rapida input::placeholder{color:#9aa3ac}
  .btn{
    border:1px solid var(--linha);background:var(--superficie);padding:10px 14px;
    border-radius:var(--raio);cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:#f3f5f7}
  .btn-forte{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .btn-forte:hover{background:#000}
  .btn-fraco{border:0;background:none;color:var(--suave);padding:6px 8px;cursor:pointer;border-radius:var(--raio)}
  .btn-fraco:hover{background:#dfe4e9;color:var(--tinta)}

  .barra-busca{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .barra-busca input[type=search]{
    flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--linha);
    border-radius:var(--raio);background:var(--superficie);
  }
  .barra-busca select{padding:9px 10px;border:1px solid var(--linha);border-radius:var(--raio);background:var(--superficie)}

  /* linhas de tarefa */
  .lista{border:1px solid var(--linha);border-radius:var(--raio);background:var(--superficie);overflow:hidden}
  .tarefa{display:flex;gap:12px;padding:11px 14px 11px 11px;border-bottom:1px solid #eaedf0;border-left:3px solid transparent}
  .tarefa:last-child{border-bottom:0}
  .tarefa[data-status="pendente"]{border-left-color:var(--tijolo)}
  .tarefa[data-status="andamento"]{border-left-color:var(--ambar)}
  .tarefa[data-status="concluida"]{border-left-color:var(--verde)}
  .tarefa[data-status="concluida"] .titulo{color:var(--suave);text-decoration:line-through}
  .marcar{
    flex:none;width:19px;height:19px;margin-top:2px;border:1.5px solid #aeb6be;background:#fff;
    border-radius:2px;cursor:pointer;padding:0;position:relative;
  }
  .marcar:hover{border-color:var(--verde)}
  .tarefa[data-status="concluida"] .marcar{background:var(--verde);border-color:var(--verde)}
  .marcar::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);opacity:0}
  .tarefa[data-status="concluida"] .marcar::after{opacity:1}
  .miolo{flex:1;min-width:0}
  .titulo{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;width:100%}
  .titulo:hover{text-decoration:underline}
  .nota{margin:3px 0 0;font-size:14px;color:var(--suave);white-space:pre-wrap}
  .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:13px;color:var(--suave);align-items:center}
  .proj{color:var(--cobalto)}
  .prazo-vencido{color:var(--tijolo);font-weight:500}
  .alta{color:var(--tijolo);font-weight:500}
  .acoes{display:flex;gap:2px;flex:none;align-items:flex-start}
  select.status{border:1px solid var(--linha);border-radius:var(--raio);padding:4px 6px;font-size:13px;background:var(--superficie)}

  /* textos prontos */
  .textos{display:grid;gap:12px}
  .texto{border:1px solid var(--linha);border-radius:var(--raio);background:var(--superficie);padding:13px 15px}
  .texto h3{margin:0;font-size:15px;font-weight:600}
  .texto .corpo-texto{
    margin:8px 0 0;white-space:pre-wrap;font-size:14px;line-height:1.55;color:#31363c;
    max-height:5.2em;overflow:hidden;position:relative;
  }
  .texto.aberto .corpo-texto{max-height:none}
  .texto .cabeca{display:flex;gap:10px;align-items:baseline}
  .texto .cabeca .marcador{font-size:13px;color:var(--cobalto)}
  .texto .rodape{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .texto .uso{margin-left:auto;font-size:13px;color:var(--suave)}

  .nada{padding:34px 16px;text-align:center;color:var(--suave);border:1px dashed var(--linha);border-radius:var(--raio)}
  .nada b{display:block;color:var(--tinta);font-weight:500;margin-bottom:4px}

  /* modal */
  dialog{border:1px solid var(--linha);border-radius:var(--raio);padding:0;width:min(560px,92vw);background:var(--superficie);color:var(--tinta)}
  dialog::backdrop{background:rgba(22,25,29,.42)}
  dialog form{padding:20px}
  dialog h2{margin:0 0 16px;font-size:17px;font-weight:600}
  .campo{margin-bottom:13px}
  .campo label{display:block;font-size:13px;color:var(--suave);margin-bottom:4px}
  .campo input,.campo textarea,.campo select{
    width:100%;padding:9px 11px;border:1px solid var(--linha);border-radius:var(--raio);background:#fff;
  }
  .campo textarea{min-height:150px;resize:vertical;line-height:1.55}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pe{display:flex;gap:8px;margin-top:18px}
  .pe .btn-fraco{margin-right:auto}

  .aviso{background:#fdf2e6;border:1px solid #e8c795;padding:10px 13px;border-radius:var(--raio);font-size:14px;margin:16px 0 0}
  .rodape-app{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap;align-items:center}
  .rodape-app span{color:var(--suave);font-size:13px;margin-left:auto}

  @media (max-width:820px){
    .corpo{grid-template-columns:1fr;gap:18px}
    aside{position:static}
    .grupo{margin-bottom:14px}
    .grupo div.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
    .grupo div.chips button{width:auto;border:1px solid var(--linha);white-space:nowrap}
    .acoes{flex-direction:column}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="quadro">
  <header class="topo">
    <div class="marca">
      <h1>Pauta</h1>
      <p>Tarefas e textos prontos</p>
      <span class="salvo" id="salvo">carregando…</span>
    </div>
    <div class="termometro" id="termometro" aria-hidden="true">
      <span class="t-pendente" style="width:0"></span>
      <span class="t-andamento" style="width:0"></span>
      <span class="t-concluida" style="width:0"></span>
    </div>
    <div class="legenda" id="legenda"></div>
    <nav class="abas" role="tablist">
      <button role="tab" id="aba-tarefas" aria-selected="true">Tarefas <span class="conta" id="c-tarefas"></span></button>
      <button role="tab" id="aba-textos" aria-selected="false">Textos prontos <span class="conta" id="c-textos"></span></button>
    </nav>
  </header>

  <div class="corpo">
    <aside id="lateral"></aside>
    <main id="painel"></main>
  </div>

  <div class="rodape-app">
    <button class="btn" id="exportar">Baixar backup</button>
    <button class="btn" id="importar">Restaurar backup</button>
    <input type="file" id="arquivo" accept="application/json" hidden>
    <span id="resumo-rodape"></span>
  </div>
</div>

<dialog id="dlg-tarefa"><form method="dialog">
  <h2 id="titulo-dlg-tarefa">Editar tarefa</h2>
  <div class="campo"><label for="t-titulo">Tarefa</label><input id="t-titulo" required></div>
  <div class="campo"><label for="t-nota">Detalhes</label><textarea id="t-nota" style="min-height:90px"></textarea></div>
  <div class="dupla">
    <div class="campo"><label for="t-projeto">Projeto / cliente</label><input id="t-projeto" list="lista-projetos" autocomplete="off"><datalist id="lista-projetos"></datalist></div>
    <div class="campo"><label for="t-prazo">Prazo</label><input id="t-prazo" type="date"></div>
  </div>
  <div class="dupla">
    <div class="campo"><label for="t-status">Situação</label><select id="t-status">
      <option value="pendente">Pendente</option><option value="andamento">Em andamento</option><option value="concluida">Concluída</option>
    </select></div>
    <div class="campo"><label for="t-prio">Prioridade</label><select id="t-prio">
      <option value="normal">Normal</option><option value="alta">Alta</option>
    </select></div>
  </div>
  <div class="pe">
    <button type="button" class="btn-fraco" id="t-excluir">Excluir</button>
    <button type="button" class="btn" id="t-cancelar">Cancelar</button>
    <button type="button" class="btn btn-forte" id="t-salvar">Salvar</button>
  </div>
</form></dialog>

<dialog id="dlg-texto"><form method="dialog">
  <h2 id="titulo-dlg-texto">Novo texto</h2>
  <div class="campo"><label for="x-titulo">Título</label><input id="x-titulo" required placeholder="Ex.: Cobrança de mensalidade atrasada"></div>
  <div class="campo"><label for="x-marcador">Marcador</label><input id="x-marcador" list="lista-marcadores" autocomplete="off" placeholder="Ex.: Suporte, Comercial"><datalist id="lista-marcadores"></datalist></div>
  <div class="campo"><label for="x-corpo">Texto</label><textarea id="x-corpo" required></textarea></div>
  <div class="pe">
    <button type="button" class="btn-fraco" id="x-excluir">Excluir</button>
    <button type="button" class="btn" id="x-cancelar">Cancelar</button>
    <button type="button" class="btn btn-forte" id="x-salvar">Salvar</button>
  </div>
</form></dialog>

<script>
(function(){
  "use strict";
  var CHAVE = "pauta-dados-v1";
  var dados = { tarefas: [], textos: [] };
  var aba = "tarefas";
  var filtro = "abertas";
  var filtroProjeto = null;
  var filtroMarcador = null;
  var busca = "";
  var ordem = "recentes";
  var abertos = {};
  var editandoTarefa = null, editandoTexto = null;
  var semArmazenamento = false;

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function id(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function hoje(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function dataBR(s){
    if(!s) return "";
    var p = s.split("-");
    return p[2] + "/" + p[1] + "/" + p[0].slice(2);
  }

  /* ---------- armazenamento ---------- */
  function marcar(estado){
    var el = $("salvo");
    el.dataset.estado = estado;
    el.textContent = estado === "salvando" ? "salvando…"
      : estado === "erro" ? "não foi possível salvar"
      : estado === "memoria" ? "salvo apenas nesta sessão"
      : "tudo salvo";
  }
  var timer;
  function agendar(){
    clearTimeout(timer);
    if(semArmazenamento){ marcar("memoria"); return; }
    marcar("salvando");
    timer = setTimeout(gravar, 350);
  }
  async function gravar(){
    try{
      var r = await window.storage.set(CHAVE, JSON.stringify(dados), false);
      marcar(r ? "ok" : "erro");
    }catch(e){ marcar("erro"); }
  }
  async function carregar(){
    try{
      var r = await window.storage.get(CHAVE, false);
      if(r && r.value){
        var d = JSON.parse(r.value);
        dados.tarefas = Array.isArray(d.tarefas) ? d.tarefas : [];
        dados.textos  = Array.isArray(d.textos)  ? d.textos  : [];
      }
      marcar("ok");
    }catch(e){
      // chave ainda não existe: normal na primeira abertura
      try{ await window.storage.set(CHAVE, JSON.stringify(dados), false); marcar("ok"); }
      catch(e2){ semArmazenamento = true; marcar("memoria"); }
    }
  }

  /* ---------- seleção ---------- */
  function vencida(t){ return t.status !== "concluida" && t.prazo && t.prazo < hoje(); }
  function contagens(){
    var c = {pendente:0, andamento:0, concluida:0, vencidas:0};
    dados.tarefas.forEach(function(t){ c[t.status]++; if(vencida(t)) c.vencidas++; });
    return c;
  }
  function projetos(){
    var m = {};
    dados.tarefas.forEach(function(t){ if(t.projeto) m[t.projeto] = (m[t.projeto]||0) + 1; });
    return Object.keys(m).sort().map(function(k){ return [k, m[k]]; });
  }
  function marcadores(){
    var m = {};
    dados.textos.forEach(function(x){ if(x.marcador) m[x.marcador] = (m[x.marcador]||0) + 1; });
    return Object.keys(m).sort().map(function(k){ return [k, m[k]]; });
  }
  function tarefasVisiveis(){
    var q = busca.toLowerCase();
    var lista = dados.tarefas.filter(function(t){
      if(filtro === "abertas" && t.status === "concluida") return false;
      if(filtro === "pendente" && t.status !== "pendente") return false;
      if(filtro === "andamento" && t.status !== "andamento") return false;
      if(filtro === "concluida" && t.status !== "concluida") return false;
      if(filtro === "vencidas" && !vencida(t)) return false;
      if(filtroProjeto && t.projeto !== filtroProjeto) return false;
      if(q && (t.titulo + " " + (t.nota||"") + " " + (t.projeto||"")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var peso = {pendente:0, andamento:0, concluida:1};
    lista.sort(function(a,b){
      if(peso[a.status] !== peso[b.status]) return peso[a.status] - peso[b.status];
      if(vencida(a) !== vencida(b)) return vencida(a) ? -1 : 1;
      if(!!a.prazo !== !!b.prazo) return a.prazo ? -1 : 1;
      if(a.prazo && b.prazo && a.prazo !== b.prazo) return a.prazo < b.prazo ? -1 : 1;
      if(a.prioridade !== b.prioridade) return a.prioridade === "alta" ? -1 : 1;
      return b.criada - a.criada;
    });
    return lista;
  }
  function textosVisiveis(){
    var q = busca.toLowerCase();
    var lista = dados.textos.filter(function(x){
      if(filtroMarcador && x.marcador !== filtroMarcador) return false;
      if(q && (x.titulo + " " + x.corpo + " " + (x.marcador||"")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    lista.sort(function(a,b){
      if(ordem === "usados") return (b.usos||0) - (a.usos||0) || b.criado - a.criado;
      if(ordem === "titulo") return a.titulo.localeCompare(b.titulo, "pt-BR");
      return b.criado - a.criado;
    });
    return lista;
  }

  /* ---------- desenho ---------- */
  function desenhar(){
    var c = contagens();
    var total = dados.tarefas.length || 1;
    var barras = $("termometro").children;
    barras[0].style.width = (c.pendente/total*100) + "%";
    barras[1].style.width = (c.andamento/total*100) + "%";
    barras[2].style.width = (c.concluida/total*100) + "%";
    $("legenda").innerHTML =
      '<span><i style="background:var(--tijolo)"></i><b>' + c.pendente + '</b> pendentes</span>' +
      '<span><i style="background:var(--ambar)"></i><b>' + c.andamento + '</b> em andamento</span>' +
      '<span><i style="background:var(--verde)"></i><b>' + c.concluida + '</b> concluídas</span>' +
      (c.vencidas ? '<span class="prazo-vencido">' + c.vencidas + ' com prazo vencido</span>' : '');
    $("c-tarefas").textContent = c.pendente + c.andamento;
    $("c-textos").textContent = dados.textos.length;
    $("resumo-rodape").textContent = dados.tarefas.length + " tarefas · " + dados.textos.length + " textos guardados";
    $("aba-tarefas").setAttribute("aria-selected", aba === "tarefas");
    $("aba-textos").setAttribute("aria-selected", aba === "textos");
    $("lista-projetos").innerHTML = projetos().map(function(p){ return '<option value="' + esc(p[0]) + '">'; }).join("");
    $("lista-marcadores").innerHTML = marcadores().map(function(p){ return '<option value="' + esc(p[0]) + '">'; }).join("");
    aba === "tarefas" ? desenharTarefas(c) : desenharTextos();
  }

  function botaoFiltro(valor, rotulo, n, ativo, tipo){
    return '<button data-' + tipo + '="' + esc(valor) + '" aria-pressed="' + ativo + '">' +
      esc(rotulo) + '<span class="n">' + n + '</span></button>';
  }

  function desenharTarefas(c){
    var abertasN = c.pendente + c.andamento;
    var proj = projetos();
    $("lateral").innerHTML =
      '<div class="grupo"><h2>Situação</h2><div class="chips">' +
        botaoFiltro("abertas","Em aberto",abertasN,filtro==="abertas","filtro") +
        botaoFiltro("pendente","Pendentes",c.pendente,filtro==="pendente","filtro") +
        botaoFiltro("andamento","Em andamento",c.andamento,filtro==="andamento","filtro") +
        botaoFiltro("vencidas","Prazo vencido",c.vencidas,filtro==="vencidas","filtro") +
        botaoFiltro("concluida","Concluídas",c.concluida,filtro==="concluida","filtro") +
        botaoFiltro("todas","Todas",dados.tarefas.length,filtro==="todas","filtro") +
      '</div></div>' +
      '<div class="grupo"><h2>Projeto</h2><div class="chips">' +
        (proj.length
          ? botaoFiltro("","Todos",dados.tarefas.length,!filtroProjeto,"projeto") +
            proj.map(function(p){ return botaoFiltro(p[0],p[0],p[1],filtroProjeto===p[0],"projeto"); }).join("")
          : '<p class="vazio-filtro">Nenhum projeto ainda. Abra uma tarefa e informe o projeto ou cliente.</p>') +
      '</div></div>';

    var lista = tarefasVisiveis();
    var html =
      '<div class="rapida">' +
        '<input id="nova" placeholder="O que precisa ser feito?" autocomplete="off">' +
        '<button class="btn btn-forte" id="add-tarefa">Adicionar</button>' +
      '</div>' +
      '<div class="barra-busca">' +
        '<input type="search" id="busca" placeholder="Buscar em tarefas e detalhes" value="' + esc(busca) + '">' +
        (c.concluida ? '<button class="btn" id="limpar-concluidas">Limpar concluídas</button>' : '') +
      '</div>';

    if(!lista.length){
      html += dados.tarefas.length
        ? '<div class="nada"><b>Nada neste filtro</b>Troque a situação ou o projeto na lateral.</div>'
        : '<div class="nada"><b>Sua pauta está vazia</b>Escreva a primeira tarefa no campo acima e pressione Enter.</div>';
    }else{
      html += '<div class="lista">' + lista.map(linhaTarefa).join("") + '</div>';
    }
    $("painel").innerHTML = html;
  }

  function linhaTarefa(t){
    var meta = [];
    if(t.projeto) meta.push('<span class="proj">' + esc(t.projeto) + '</span>');
    if(t.prazo) meta.push('<span class="' + (vencida(t) ? "prazo-vencido" : "") + '">' +
      (vencida(t) ? "venceu " : "prazo ") + dataBR(t.prazo) + '</span>');
    if(t.prioridade === "alta" && t.status !== "concluida") meta.push('<span class="alta">alta</span>');
    return '<div class="tarefa" data-status="' + t.status + '">' +
      '<button class="marcar" data-alternar="' + t.id + '" aria-label="Concluir tarefa"></button>' +
      '<div class="miolo">' +
        '<button class="titulo" data-abrir="' + t.id + '">' + esc(t.titulo) + '</button>' +
        (t.nota ? '<p class="nota">' + esc(t.nota) + '</p>' : '') +
        (meta.length ? '<div class="meta">' + meta.join("") + '</div>' : '') +
      '</div>' +
      '<div class="acoes">' +
        '<select class="status" data-status-de="' + t.id + '" aria-label="Situação">' +
          '<option value="pendente"' + (t.status==="pendente"?" selected":"") + '>Pendente</option>' +
          '<option value="andamento"' + (t.status==="andamento"?" selected":"") + '>Em andamento</option>' +
          '<option value="concluida"' + (t.status==="concluida"?" selected":"") + '>Concluída</option>' +
        '</select>' +
      '</div>' +
    '</div>';
  }

  function desenharTextos(){
    var marc = marcadores();
    $("lateral").innerHTML =
      '<div class="grupo"><h2>Marcador</h2><div class="chips">' +
        (marc.length
          ? botaoFiltro("","Todos",dados.textos.length,!filtroMarcador,"marcador") +
            marc.map(function(p){ return botaoFiltro(p[0],p[0],p[1],filtroMarcador===p[0],"marcador"); }).join("")
          : '<p class="vazio-filtro">Marcadores aparecem aqui quando você usar um.</p>') +
      '</div></div>';

    var lista = textosVisiveis();
    var html =
      '<div class="rapida"><button class="btn btn-forte" id="add-texto">Novo texto</button></div>' +
      '<div class="barra-busca">' +
        '<input type="search" id="busca" placeholder="Buscar no conteúdo dos textos" value="' + esc(busca) + '">' +
        '<select id="ordem">' +
          '<option value="recentes"' + (ordem==="recentes"?" selected":"") + '>Mais recentes</option>' +
          '<option value="usados"' + (ordem==="usados"?" selected":"") + '>Mais usados</option>' +
          '<option value="titulo"' + (ordem==="titulo"?" selected":"") + '>Título A–Z</option>' +
        '</select>' +
      '</div>';

    if(!lista.length){
      html += dados.textos.length
        ? '<div class="nada"><b>Nada neste filtro</b>Ajuste a busca ou o marcador.</div>'
        : '<div class="nada"><b>Nenhum texto guardado</b>Guarde aqui as mensagens que você repete todo dia e copie com um clique.</div>';
    }else{
      html += '<div class="textos">' + lista.map(cartaoTexto).join("") + '</div>';
    }
    $("painel").innerHTML = html;
  }

  function cartaoTexto(x){
    var longo = x.corpo.length > 220 || x.corpo.split("\n").length > 3;
    return '<article class="texto' + (abertos[x.id] ? " aberto" : "") + '">' +
      '<div class="cabeca"><h3>' + esc(x.titulo) + '</h3>' +
        (x.marcador ? '<span class="marcador">' + esc(x.marcador) + '</span>' : '') + '</div>' +
      '<p class="corpo-texto">' + esc(x.corpo) + '</p>' +
      '<div class="rodape">' +
        '<button class="btn" data-copiar="' + x.id + '">Copiar</button>' +
        '<button class="btn-fraco" data-editar-texto="' + x.id + '">Editar</button>' +
        (longo ? '<button class="btn-fraco" data-expandir="' + x.id + '">' + (abertos[x.id] ? "Recolher" : "Ver tudo") + '</button>' : '') +
        (x.usos ? '<span class="uso">copiado ' + x.usos + (x.usos > 1 ? " vezes" : " vez") + '</span>' : '') +
      '</div>' +
    '</article>';
  }

  /* ---------- ações ---------- */
  function novaTarefa(titulo){
    titulo = titulo.trim();
    if(!titulo) return;
    dados.tarefas.push({
      id:id(), titulo:titulo, nota:"", projeto:filtroProjeto || "", prazo:"",
      status:"pendente", prioridade:"normal", criada:Date.now()
    });
    agendar(); desenhar();
    var campo = $("nova");
    if(campo) campo.focus();
  }
  function acharTarefa(i){ return dados.tarefas.filter(function(t){ return t.id === i; })[0]; }
  function acharTexto(i){ return dados.textos.filter(function(x){ return x.id === i; })[0]; }

  function abrirTarefa(t){
    editandoTarefa = t;
    $("titulo-dlg-tarefa").textContent = "Editar tarefa";
    $("t-titulo").value = t.titulo;
    $("t-nota").value = t.nota || "";
    $("t-projeto").value = t.projeto || "";
    $("t-prazo").value = t.prazo || "";
    $("t-status").value = t.status;
    $("t-prio").value = t.prioridade || "normal";
    $("dlg-tarefa").showModal();
    $("t-titulo").focus();
  }
  function abrirTexto(x){
    editandoTexto = x;
    $("titulo-dlg-texto").textContent = x ? "Editar texto" : "Novo texto";
    $("x-titulo").value = x ? x.titulo : "";
    $("x-marcador").value = x ? (x.marcador || "") : (filtroMarcador || "");
    $("x-corpo").value = x ? x.corpo : "";
    $("x-excluir").style.display = x ? "" : "none";
    $("dlg-texto").showModal();
    $("x-titulo").focus();
  }
  async function copiar(texto, botao){
    var ok = false;
    try{ await navigator.clipboard.writeText(texto); ok = true; }
    catch(e){
      var ta = document.createElement("textarea");
      ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ ok = document.execCommand("copy"); }catch(e2){}
      document.body.removeChild(ta);
    }
    botao.textContent = ok ? "Copiado" : "Selecione e copie";
    setTimeout(function(){ botao.textContent = "Copiar"; }, 1400);
    return ok;
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;

    if(b.id === "aba-tarefas"){ aba = "tarefas"; busca = ""; desenhar(); return; }
    if(b.id === "aba-textos"){ aba = "textos"; busca = ""; desenhar(); return; }

    if(b.dataset.filtro){ filtro = b.dataset.filtro; desenhar(); return; }
    if(b.dataset.projeto !== undefined && b.hasAttribute("data-projeto")){
      filtroProjeto = b.dataset.projeto || null; desenhar(); return;
    }
    if(b.dataset.marcador !== undefined && b.hasAttribute("data-marcador")){
      filtroMarcador = b.dataset.marcador || null; desenhar(); return;
    }

    if(b.id === "add-tarefa"){ novaTarefa($("nova").value); $("nova").value = ""; return; }
    if(b.id === "add-texto"){ abrirTexto(null); return; }

    if(b.dataset.alternar){
      var t = acharTarefa(b.dataset.alternar);
      t.status = t.status === "concluida" ? "pendente" : "concluida";
      agendar(); desenhar(); return;
    }
    if(b.dataset.abrir){ abrirTarefa(acharTarefa(b.dataset.abrir)); return; }
    if(b.dataset.editarTexto){ abrirTexto(acharTexto(b.dataset.editarTexto)); return; }
    if(b.dataset.expandir){ abertos[b.dataset.expandir] = !abertos[b.dataset.expandir]; desenhar(); return; }
    if(b.dataset.copiar){
      var x = acharTexto(b.dataset.copiar);
      copiar(x.corpo, b).then(function(ok){ if(ok){ x.usos = (x.usos||0) + 1; agendar(); } });
      return;
    }
    if(b.id === "limpar-concluidas"){
      var n = dados.tarefas.filter(function(t){ return t.status === "concluida"; }).length;
      if(confirm("Remover " + n + " tarefa(s) concluída(s)? Isso não pode ser desfeito.")){
        dados.tarefas = dados.tarefas.filter(function(t){ return t.status !== "concluida"; });
        agendar(); desenhar();
      }
      return;
    }

    if(b.id === "t-salvar"){
      var v = $("t-titulo").value.trim();
      if(!v){ $("t-titulo").focus(); return; }
      var a = editandoTarefa;
      a.titulo = v; a.nota = $("t-nota").value.trim(); a.projeto = $("t-projeto").value.trim();
      a.prazo = $("t-prazo").value; a.status = $("t-status").value; a.prioridade = $("t-prio").value;
      $("dlg-tarefa").close(); agendar(); desenhar(); return;
    }
    if(b.id === "t-cancelar"){ $("dlg-tarefa").close(); return; }
    if(b.id === "t-excluir"){
      if(confirm("Excluir esta tarefa?")){
        dados.tarefas = dados.tarefas.filter(function(t){ return t.id !== editandoTarefa.id; });
        $("dlg-tarefa").close(); agendar(); desenhar();
      }
      return;
    }

    if(b.id === "x-salvar"){
      var tit = $("x-titulo").value.trim(), corpo = $("x-corpo").value;
      if(!tit || !corpo.trim()){ (!tit ? $("x-titulo") : $("x-corpo")).focus(); return; }
      if(editandoTexto){
        editandoTexto.titulo = tit; editandoTexto.corpo = corpo; editandoTexto.marcador = $("x-marcador").value.trim();
      }else{
        dados.textos.push({ id:id(), titulo:tit, corpo:corpo, marcador:$("x-marcador").value.trim(), usos:0, criado:Date.now() });
      }
      $("dlg-texto").close(); agendar(); desenhar(); return;
    }
    if(b.id === "x-cancelar"){ $("dlg-texto").close(); return; }
    if(b.id === "x-excluir"){
      if(editandoTexto && confirm("Excluir este texto?")){
        dados.textos = dados.textos.filter(function(x){ return x.id !== editandoTexto.id; });
        $("dlg-texto").close(); agendar(); desenhar();
      }
      return;
    }

    if(b.id === "exportar"){
      var blob = new Blob([JSON.stringify(dados, null, 2)], {type:"application/json"});
      var a2 = document.createElement("a");
      a2.href = URL.createObjectURL(blob);
      a2.download = "pauta-" + hoje() + ".json";
      a2.click(); URL.revokeObjectURL(a2.href);
      return;
    }
    if(b.id === "importar"){ $("arquivo").click(); return; }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Enter" && e.target.id === "nova"){
      e.preventDefault(); novaTarefa(e.target.value); e.target.value = "";
    }
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){
      if($("dlg-tarefa").open) $("t-salvar").click();
      if($("dlg-texto").open) $("x-salvar").click();
    }
  });

  document.addEventListener("input", function(e){
    if(e.target.id === "busca"){
      busca = e.target.value;
      var pos = e.target.selectionStart;
      desenhar();
      var novo = $("busca");
      if(novo){ novo.focus(); novo.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener("change", function(e){
    if(e.target.dataset && e.target.dataset.statusDe){
      acharTarefa(e.target.dataset.statusDe).status = e.target.value;
      agendar(); desenhar(); return;
    }
    if(e.target.id === "ordem"){ ordem = e.target.value; desenhar(); return; }
    if(e.target.id === "arquivo" && e.target.files[0]){
      var leitor = new FileReader();
      leitor.onload = function(){
        try{
          var d = JSON.parse(leitor.result);
          if(!d.tarefas && !d.textos) throw new Error("formato");
          if(confirm("Substituir a pauta atual pelo conteúdo do backup?")){
            dados.tarefas = d.tarefas || [];
            dados.textos = d.textos || [];
            agendar(); desenhar();
          }
        }catch(err){ alert("Este arquivo não é um backup da Pauta."); }
      };
      leitor.readAsText(e.target.files[0]);
      e.target.value = "";
    }
  });

  carregar().then(function(){
    desenhar();
    if(semArmazenamento){
      $("painel").insertAdjacentHTML("afterbegin",
        '<div class="aviso">O armazenamento não respondeu. Suas anotações valem só nesta sessão — baixe um backup antes de fechar.</div>');
    }
  });
})();
</script>
